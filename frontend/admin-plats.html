<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion plats - FoodExpress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white">
    <div class="flex min-h-screen">
        <!-- sidebar identique -->
         <aside class="w-64 bg-gray-800 p-5">
            <h1 class="text-2xl font-bold mb-8"> FoodExpress</h1>
            <nav class="space-y-3">
                <a href="dashboard.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-700">
                    <i class="fas fa-utensils"></i> Plats
                </a>
            </nav>
         </aside>
         <!-- Main content -->
          <main class="flex-1 p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Gestion des plats</h2>
                <button class="bg-orange-500 px-6 py-3 rounded-lg font-semibold hover: bg-orange-600">
                    + Ajouter un plat
                </button>
            </div>
            <!-- Filtres -->
             <div class="flex gap4 mb-6">
                <input type="text" placeholder="recher un plat..."
                class="bg-gray-800 px-4 py-2 rounded-lg flex-1 focus:outline-none focus:ring-2 focus:ring-orange-500">
                <select class="bg-gray-800 px-4 py-2 rounded-lg">
                    <option>Toutes catégories</option>
                    <option>Plats tradictionnels</option>
                    <option>Fast food</option>
                    <option>Desserts</option>
                </select>
             </div>
             <!-- Tableau des plats -->
              <div class="bg-gray-800 rounded-xl overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-700">
                        <tr>
                            <th class="text-left p-4">plats</th>
                            <th class="text-left p-4">catégories</th>
                            <th class="text-left p-4">Prix</th>
                            <th class="text-left p-4">Stock</th>
                            <th class="text-left p-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-700 hover:bg-gray-750">
                            <td class="p-4 flex items-center gap-3">
                                <img src="https://via.placeholder.com/50" class="rounded-lg" alt="plat">
                                Thieboudienne
                            </td>
                            <td class="p-4">Plat tradictionnels</td>
                            <td class="p-4">2500 FCFA</td>
                            <td class="p-4"><span class="bg-green-500 px-2 py-1 rounded text-sm">En stock</span></td>
                            <td class="p-4 flex gap-2">
                                <button class="text-blue-400 hover:text-blue-300"><i class="fas fa-edit"></i></button>
                                <button class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr class="border-b border-gray-700 hover:bg-gray-750">
                            <td class="p-4 flex items-center gap-3">
                                <img src="https://via.placeholder.com/50" class="rounded-lg" alt="plat">
                                Mafé
                            </td>
                            <td class="p-4">Plat tradictionnels</td>
                            <td class="p-4">3000 FCFA</td>
                            <td class="p-4"><span class="bg-red-500 px-2 py-1 rounded text-sm">Rupture</span></td>
                            <td class="p-4 flex gap-2">
                                <button class="text-blue-400 hover:text-blue-300"><i class="fas fa-edit"></i></button>
                                <button class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
              </div>
          </main>
    </div>
</body>
</html>
