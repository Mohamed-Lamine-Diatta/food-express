<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Plats</title>
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/mdione.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar"><div class="admin-logo"><a href="index.html" class="logo"><span class="logo-icon">🍽️</span><span class="logo-name">Food Express</span></a></div><nav class="admin-nav"><a href="admin-dashboard.html">📊 Dashboard</a><a href="admin-commandes.html">📋 Commandes</a><a class="active" href="admin-plats.html">🍽️ Plats</a><a href="restaurants.html">🏪 Restaurants</a></nav></aside>
    <main class="admin-main"><div class="admin-top"><div><h1>Gestion des Plats</h1><p class="section-subtitle">Ajouter, modifier ou supprimer les plats</p></div><button class="btn-fill" id="showDishForm">+ Ajouter un plat</button></div>
      <form class="panel dish-form" id="dishForm" hidden><div class="form-grid"><input class="form-control" name="nom" placeholder="Nom du plat" required><input class="form-control" name="prix" type="number" placeholder="Prix" required><select class="form-control" name="categorie"><option>Plats</option><option>Entrées</option><option>Boissons</option><option>Desserts</option></select><input class="form-control" name="emoji" placeholder="Emoji" value="🍽️"></div><textarea class="form-control" name="description" placeholder="Description"></textarea><button class="btn-fill" type="submit">Enregistrer</button></form>
      <div class="admin-toolbar"><div class="search-box"><span>🔍</span><input id="dishSearch" placeholder="Rechercher un plat..."></div><div class="pills dish-filters"><button class="pill active" data-cat="tous">Tous</button><button class="pill" data-cat="plats">Plats</button><button class="pill" data-cat="boissons">Boissons</button><button class="pill" data-cat="desserts">Desserts</button></div></div>
      <div class="panel table-wrap"><table class="data-table"><thead><tr><th>Plat</th><th>Prix</th><th>Catégorie</th><th>Restaurant</th><th>Dispo</th><th>Actions</th></tr></thead><tbody id="dishesBody"></tbody></table></div>
    </main>
  </div>
  <script src="js/api.js"></script><script src="js/mdione.js"></script>
</body>
</html>
