<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Express - Connexion</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/demba.css">
</head>
<body>
  <nav class="navbar"><div class="container nav-inner"><a href="index.html" class="logo"><span class="logo-icon">🍽️</span><span class="logo-name">Food Express</span></a><ul class="nav-links"><li><a href="index.html">Accueil</a></li><li><a href="restaurants.html">Restaurants</a></li></ul><div class="nav-actions"><a class="btn-outline" href="restaurants.html">Voir les restos</a></div></div></nav>
  <main class="page auth-page">
    <section class="container auth-wrap">
      <div class="auth-info">
        <span class="badge">👋 Bienvenue</span>
        <h1>Connectez-vous pour commander facilement.</h1>
        <p>Gardez votre panier, suivez vos commandes et retrouvez vos restaurants favoris.</p>
      </div>
      <div class="panel form-card auth-card">
        <div class="auth-tabs"><button class="active" data-tab="login">Connexion</button><button data-tab="register">Inscription</button></div>
        <form id="loginForm" class="auth-form">
          <div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" value="fatou@email.com" required></div>
          <div class="form-group"><label>Mot de passe</label><input class="form-control" name="password" type="password" value="client123" required></div>
          <button class="btn-fill full" type="submit">Se connecter →</button>
          <p class="form-msg" id="loginMsg"></p>
        </form>
        <form id="registerForm" class="auth-form hidden">
          <div class="form-group"><label>Nom complet</label><input class="form-control" name="nom" placeholder="Votre nom" required></div>
          <div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" placeholder="votre@email.com" required></div>
          <div class="form-group"><label>Téléphone</label><input class="form-control" name="telephone" placeholder="77 000 00 00"></div>
          <div class="form-group"><label>Adresse</label><input class="form-control" name="adresse" placeholder="Dakar"></div>
          <div class="form-group"><label>Mot de passe</label><input class="form-control" name="password" type="password" placeholder="minimum 6 caractères" required></div>
          <button class="btn-fill full" type="submit">Créer mon compte →</button>
          <p class="form-msg" id="registerMsg"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/demba.js"></script>
</body>
</html>
