<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Express - Confirmation</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="confirmation-card">
    <div class="icon">✅</div>

    <h1>Commande Confirmée</h1>

    <p class="message">
        Merci pour votre commande. Elle a été enregistrée avec succès.
    </p>

    <div class="details">
        <p><strong>N° Commande :</strong> <span id="numero">En cours de chargement...</span></p>
<p><strong>Temps estimé :</strong> <span id="temps">En cours de chargement...</span></p>
    </div>

    <button id="btnHistorique">
        Voir mes commandes
    </button>

</div>

<script src="js/confirmation.js"></script>
</body>
</html>
