<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Express - Panier</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/demba.css">
</head>
<body>
  <nav class="navbar"><div class="container nav-inner"><a href="index.html" class="logo"><span class="logo-icon">🍽️</span><span class="logo-name">Food Express</span></a><ul class="nav-links"><li><a href="restaurants.html">Restaurants</a></li><li><a class="active" href="panier.html">Panier</a></li><li><a href="historique.html">Commandes</a></li></ul><div class="nav-actions"><a href="menu.html" class="btn-outline">Ajouter des plats</a></div></div></nav>
  <main class="page">
    <section class="hero-section cart-hero"><div class="container"><span class="badge">🛒 Étape 2/3</span><h1>Mon Panier</h1><p>Vérifiez votre commande avant de confirmer.</p></div></section>
    <section class="container cart-layout">
      <div class="panel cart-list">
        <div class="cart-steps"><span class="done">✓ Menu</span><span class="active">2 Panier</span><span>3 Confirmation</span></div>
        <div id="cartItems"></div>
        <div class="empty" id="cartEmpty" hidden>Votre panier est vide. <br><br><a class="btn-fill" href="menu.html">Voir le menu</a></div>
      </div>
      <aside class="panel cart-summary">
        <h2>Résumé</h2>
        <div class="sum-row"><span>Sous-total</span><strong id="subtotal">0 FCFA</strong></div>
        <div class="sum-row"><span>Frais service</span><strong id="serviceFee">200 FCFA</strong></div>
        <div class="sum-row total"><span>Total</span><strong id="cartTotal">0 FCFA</strong></div>
        <div class="form-group"><label>Adresse livraison</label><input id="deliveryAddress" class="form-control" placeholder="Ex: Point E, Dakar"></div>
        <div class="form-group"><label>Téléphone</label><input id="deliveryPhone" class="form-control" placeholder="77 000 00 00"></div>
        <button id="confirmOrder" class="btn-fill full">✅ Confirmer la commande</button>
        <p class="form-msg" id="cartMsg"></p>
      </aside>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/demba.js"></script>
</body>
</html>
